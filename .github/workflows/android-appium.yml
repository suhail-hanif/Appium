name: Android Appium Tests

on:
  push:
    branches:
      - master

jobs:
  android-tests:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add Android tools to PATH
      run: |
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install npm dependencies
      run: |
        npm ci

    - name: Install Appium
      run: |
        npm install -g appium

    - name: Install Android SDK components
      run: |
        yes | sdkmanager --licenses

        sdkmanager \
          "platform-tools" \
          "platforms;android-33" \
          "emulator" \
          "system-images;android-33;google_apis;x86_64"


    - name: Create Android Emulator
      run: |
        echo "no" | avdmanager create avd \
          -n test \
          -k "system-images;android-33;google_apis;x86_64" \
          --force

        echo "AVD created"


    - name: Start Android Emulator
      timeout-minutes: 10
      run: |

        echo "Starting emulator"

        emulator \
          -avd test \
          -no-window \
          -no-audio \
          -no-boot-anim \
          -no-snapshot \
          -gpu swiftshader_indirect \
          -memory 2048 \
          -verbose \
          > emulator.log 2>&1 &


        echo "Waiting for emulator device"

        adb wait-for-device


        echo "Device detected"

        adb devices


        echo "Waiting for Android boot"


        timeout 300 bash -c '
        while true; do

          BOOT=$(adb shell getprop sys.boot_completed | tr -d "\r")

          echo "Boot status: $BOOT"

          if [ "$BOOT" = "1" ]; then
            break
          fi

          sleep 5

        done
        '


        echo "Disabling animations"

        adb shell settings put global window_animation_scale 0
        adb shell settings put global transition_animation_scale 0
        adb shell settings put global animator_duration_scale 0


        adb shell input keyevent 82


        echo "Android emulator ready"


    - name: Emulator diagnostics
      if: always()
      run: |
        adb devices || true
        adb shell getprop ro.product.model || true
        adb shell getprop ro.build.version.release || true
        tail -100 emulator.log || true


    - name: Start Appium Server
      run: |

        echo "Starting Appium"

        appium \
          --log-level info \
          > appium.log 2>&1 &


        sleep 10


        curl http://127.0.0.1:4723/status


    - name: Run WebdriverIO Tests
      run: |
        npm run wdio


    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: android-test-logs
        path: |
          emulator.log
          appium.log