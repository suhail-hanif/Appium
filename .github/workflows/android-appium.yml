name: Android Appium Tests

on:
  push:
    branches:
      - master

jobs:
  android-tests:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add Android tools to PATH
      run: |
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install npm dependencies
      run: |
        npm ci

    - name: Install Appium
      run: |
        npm install -g appium

    - name: Install Android Emulator Image
      run: |
        echo "Installing Android SDK components"

        yes | sdkmanager \
          "platform-tools" \
          "platforms;android-34" \
          "emulator" \
          "system-images;android-34;google_apis;x86_64"

        echo "Android SDK setup complete"


    - name: Create Android Emulator
      run: |
        echo "Creating AVD"

        echo "no" | avdmanager create avd \
          -n test \
          -k "system-images;android-34;google_apis;x86_64" \
          --force

        echo "AVD created"


    - name: Start Android Emulator
      timeout-minutes: 10
      run: |
        echo "Starting emulator"

        emulator \
          -avd test \
          -no-window \
          -no-audio \
          -no-boot-anim \
          -gpu swiftshader_indirect \
          -no-snapshot \
          > emulator.log 2>&1 &

        echo "Waiting for emulator device"

        adb wait-for-device

        echo "Device detected"

        adb devices

        echo "Checking boot status"

        timeout 300 bash -c '
        while true; do
          BOOT=$(adb shell getprop sys.boot_completed | tr -d "\r")
          echo "Boot status: $BOOT"

          if [ "$BOOT" = "1" ]; then
            break
          fi

          sleep 5
        done
        '

        echo "Unlocking device"

        adb shell input keyevent 82

        echo "Emulator ready"

    - name: Emulator diagnostics
      if: always()
      run: |
        adb devices
        adb shell getprop ro.product.model || true
        adb shell getprop ro.build.version.release || true
        tail -100 emulator.log || true

    - name: Run WebdriverIO Tests
      run: |
        npm run wdio